name: Setup Sabre
description: Download, install and setup Sabre to your path.

inputs:
    sabre-version:
        required: false
        default: latest
        description: The version of Sabre to install. (e.g. "latest", "canary", "x.x.x")
    github-token:
        required: false
        default: ${{  github.server_url == 'https://github.com' && github.token || '' }}
        description: Personal access token (PAT) used to fetch tags from sabre-lang/sabre repository. Recommended for avoiding GitHub API rate limiting.

runs:
    using: 'composite'
    steps:
        - name: Download Sabre
          shell: bash
          run: curl -fsSL https://sabre.rroessler.io/install.sh | bash -s -- --tag ${{ inputs.sabre-version }}
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}

        - name: Update Environment
          if: runner.os == 'Windows'
          shell: powershell
          run: Join-Path $HOME ".sabre\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        - name: Update Environment
          if: runner.os != 'Windows'
          shell: bash
          run: echo "$HOME/.sabre/bin" > $GITHUB_PATH
